<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Пиксельная версия</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <!-- Игровой интерфейс -->
        <div id="gameUI" class="game-ui hidden">
            <div id="scoreContainer" class="score-container">
                <div class="pixel-counter">
                    <span class="score-label">ОЧКИ</span>
                    <span id="scoreDisplay" class="score-number">0</span>
                </div>
            </div>
            <div id="startCountdown" class="start-countdown hidden">
                <div class="countdown-text">ПРИГОТОВЬСЯ!</div>
                <div class="countdown-number" id="countdownNumber">3</div>
            </div>
            <div id="goMessage" class="go-message hidden">
                <div class="go-text">ПОЕХАЛИ!</div>
            </div>
        </div>

        <!-- Главное меню -->
        <div id="mainMenu" class="menu-screen">
            <div class="pixel-title">
                <div class="title-main">FLAPPY</div>
                <div class="title-sub">BIRD</div>
            </div>
            <div class="menu-buttons">
                <button class="pixel-button primary" onclick="startGame()">
                    <span class="button-icon">▶</span>
                    <span class="button-text">ИГРАТЬ</span>
                </button>
                <button class="pixel-button secondary" onclick="showShop()">
                    <span class="button-icon">🛍</span>
                    <span class="button-text">МАГАЗИН</span>
                </button>
                <button class="pixel-button tertiary" onclick="showRecords()">
                    <span class="button-icon">🏆</span>
                    <span class="button-text">РЕКОРДЫ</span>
                </button>
            </div>
        </div>

        <!-- Магазин -->
        <div id="shopScreen" class="shop-screen hidden">
            <div class="shop-header">
                <button class="pixel-button-small back" onclick="showMainMenu()">
                    <span>◀</span>
                </button>
                <h2 class="shop-title">МАГАЗИН</h2>
                <div class="points-display">
                    <span class="coin-icon">💰</span>
                    <span id="shopPoints">0</span>
                </div>
            </div>
            
            <div class="shop-tabs">
                <button class="tab-button active" onclick="switchTab('skins')">
                    <span>🐦</span>
                    <span>СКИНЫ</span>
                </button>
                <button class="tab-button" onclick="switchTab('backgrounds')">
                    <span>🌅</span>
                    <span>ЛОКАЦИИ</span>
                </button>
            </div>

            <div id="shopItems" class="shop-items">
                <!-- Динамически генерируется -->
            </div>
        </div>

        <!-- Таблица рекордов -->
        <div id="recordsScreen" class="records-screen hidden">
            <h2 class="records-title">РЕКОРДЫ</h2>
            <div class="records-container">
                <div class="record-card">
                    <div class="record-icon">🥇</div>
                    <div class="record-info">
                        <div class="record-label">ЛУЧШИЙ РЕЗУЛЬТАТ</div>
                        <div class="record-value" id="highScoreDisplay">0</div>
                    </div>
                </div>
                <div class="record-card">
                    <div class="record-icon">💎</div>
                    <div class="record-info">
                        <div class="record-label">ВСЕГО ОЧКОВ</div>
                        <div class="record-value" id="totalPointsDisplay">0</div>
                    </div>
                </div>
                <div class="record-card">
                    <div class="record-icon">🎮</div>
                    <div class="record-info">
                        <div class="record-label">ВСЕГО ИГР</div>
                        <div class="record-value" id="totalGamesDisplay">0</div>
                    </div>
                </div>
                <div class="record-card">
                    <div class="record-icon">📊</div>
                    <div class="record-info">
                        <div class="record-label">СРЕДНИЙ РЕЗУЛЬТАТ</div>
                        <div class="record-value" id="averageScoreDisplay">0</div>
                    </div>
                </div>
            </div>
            <button class="pixel-button back" onclick="showMainMenu()">
                <span class="button-icon">◀</span>
                <span class="button-text">НАЗАД</span>
            </button>
        </div>

        <!-- Game Over экран -->
        <div id="gameOverScreen" class="game-over-screen hidden">
            <div class="game-over-points">
                <span class="coin-icon">💰</span>
                <span id="gameOverPoints">0</span>
            </div>
            <div class="game-over-content">
                <h2 class="game-over-title">GAME OVER</h2>
                <div class="score-cards">
                    <div class="score-card">
                        <div class="score-label">ВАШ РЕЗУЛЬТАТ</div>
                        <div class="score-value" id="finalScore">0</div>
                    </div>
                    <div class="score-card best">
                        <div class="score-label">ЛУЧШИЙ РЕЗУЛЬТАТ</div>
                        <div class="score-value" id="bestScore">0</div>
                    </div>
                </div>
                <div class="game-over-buttons">
                    <button class="pixel-button primary" onclick="startGame()">
                        <span class="button-icon">🔄</span>
                        <span class="button-text">СНОВА</span>
                    </button>
                    <button class="pixel-button secondary" onclick="showMainMenu()">
                        <span class="button-icon">🏠</span>
                        <span class="button-text">МЕНЮ</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Фоновые частицы -->
        <div id="backgroundParticles" class="background-particles">
            <!-- Частицы генерируются динамически -->
        </div>
    </div>

    <!-- Аудио файлы -->
    <audio id="backgroundMusic" loop>
        <!-- Источник будет установлен динамически -->
    </audio>
    
    <audio id="buttonClickSound" preload="auto">
        <source src="sounds/button_click.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="gameOverSound" preload="auto">
        <source src="sounds/game_over.mp3" type="audio/mpeg">
    </audio>

    <audio id="scoreSound" preload="auto">
        <source src="sounds/score.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>

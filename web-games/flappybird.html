<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Полная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            border: 3px solid #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB, #98FB98);
        }

        /* Стили для меню */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            color: white;
            transition: all 0.3s ease;
        }

        .menu-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .game-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .menu-button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            border: none;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            min-width: 200px;
        }

        .menu-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .menu-button:active {
            transform: translateY(0);
        }

        /* Стили для игрового интерфейса */
        .game-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 10;
        }

        /* Стили для магазина */
        .shop-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .shop-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .shop-title {
            font-size: 24px;
            font-weight: bold;
        }

        .points-display {
            font-size: 18px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            padding: 8px 16px;
            border-radius: 15px;
            color: #000;
            font-weight: bold;
        }

        .shop-tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tab-button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            margin-right: 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
        }

        .shop-items {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .shop-item {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .shop-item:hover {
            background: rgba(255,255,255,0.2);
        }

        .item-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .item-preview {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            border: 2px solid white;
        }

        .item-details h3 {
            margin: 0;
            font-size: 16px;
        }

        .item-price {
            font-size: 14px;
            opacity: 0.8;
        }

        .buy-button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .buy-button:hover {
            transform: scale(1.05);
        }

        .buy-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .owned {
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            font-weight: bold;
        }

        .selected {
            background: #FFD700;
            color: #000;
            padding: 8px 16px;
            border-radius: 15px;
            font-weight: bold;
        }

        /* Стили для таблицы рекордов */
        .records-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .records-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .records-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #FFD700;
        }

        .record-item {
            font-size: 24px;
            margin: 10px 0;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            width: 100%;
            text-align: center;
        }

        /* Стили для Game Over */
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .game-over-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .game-over-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #FF6B6B;
        }

        .score-display {
            font-size: 20px;
            margin: 10px 0;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }

        .back-button {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            border: none;
            color: white;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-screen:not(.hidden) {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <!-- Игровой интерфейс -->
        <div id="gameUI" class="game-ui hidden">
            <div>Очки: <span id="scoreDisplay">0</span></div>
        </div>

        <!-- Главное меню -->
        <div id="mainMenu" class="menu-screen">
            <h1 class="game-title">Flappy Bird</h1>
            <button class="menu-button" onclick="startGame()">Играть</button>
            <button class="menu-button" onclick="showShop()">Магазин</button>
            <button class="menu-button" onclick="showRecords()">Рекорды</button>
        </div>

        <!-- Магазин -->
        <div id="shopScreen" class="shop-screen hidden">
            <div class="shop-header">
                <h2 class="shop-title">Магазин</h2>
                <div class="points-display">Очки: <span id="shopPoints">0</span></div>
            </div>
            
            <div class="shop-tabs">
                <button class="tab-button active" onclick="switchTab('skins')">Скины</button>
                <button class="tab-button" onclick="switchTab('backgrounds')">Локации</button>
            </div>

            <div id="shopItems" class="shop-items">
                <!-- Динамически генерируется -->
            </div>

            <button class="back-button" onclick="showMainMenu()">Назад</button>
        </div>

        <!-- Таблица рекордов -->
        <div id="recordsScreen" class="records-screen hidden">
            <h2 class="records-title">Таблица рекордов</h2>
            <div class="record-item">Лучший результат: <span id="highScoreDisplay">0</span></div>
            <div class="record-item">Всего очков: <span id="totalPointsDisplay">0</span></div>
            <button class="back-button" onclick="showMainMenu()">Назад</button>
        </div>

        <!-- Game Over экран -->
        <div id="gameOverScreen" class="game-over-screen hidden">
            <h2 class="game-over-title">Game Over!</h2>
            <div class="score-display">Ваш результат: <span id="finalScore">0</span></div>
            <div class="score-display">Лучший результат: <span id="bestScore">0</span></div>
            <button class="menu-button" onclick="startGame()">Играть снова</button>
            <button class="back-button" onclick="showMainMenu()">В меню</button>
        </div>
    </div>

    <script>
        // Глобальные переменные игры
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Состояние игры
        let gameState = 'menu'; // 'menu', 'playing', 'gameOver'
        let score = 0;
        let highScore = parseInt(localStorage.getItem('highScore') || '0');
        let totalPoints = parseInt(localStorage.getItem('totalPoints') || '0');

        // Игровые объекты
        let bird = {
            x: 50,
            y: 300,
            width: 30,
            height: 30,
            velocity: 0,
            gravity: 0.5,
            jump: -10
        };

        let pipes = [];
        let gameSpeed = 2;
        let pipeGap = 150;
        let lastPipeX = 400;

        // Настройки магазина
        const skins = [
            { id: 'default', name: 'Обычная птичка', price: 0, color: '#FFD700', owned: true, selected: true },
            { id: 'red', name: 'Красная птичка', price: 50, color: '#FF4444', owned: false, selected: false },
            { id: 'blue', name: 'Синяя птичка', price: 100, color: '#4444FF', owned: false, selected: false },
            { id: 'green', name: 'Зелёная птичка', price: 150, color: '#44FF44', owned: false, selected: false }
        ];

        const backgrounds = [
            { id: 'default', name: 'Дневное небо', price: 0, colors: ['#87CEEB', '#98FB98'], owned: true, selected: true },
            { id: 'sunset', name: 'Закат', price: 80, colors: ['#FF6B6B', '#FFE66D'], owned: false, selected: false },
            { id: 'night', name: 'Ночь', price: 120, colors: ['#2C3E50', '#4A90E2'], owned: false, selected: false },
            { id: 'space', name: 'Космос', price: 200, colors: ['#000000', '#6A0572'], owned: false, selected: false }
        ];

        let currentTab = 'skins';

        // Загрузка сохранённых данных
        function loadGameData() {
            // Загрузка скинов
            const savedSkins = localStorage.getItem('skins');
            if (savedSkins) {
                const skinData = JSON.parse(savedSkins);
                skins.forEach(skin => {
                    const savedSkin = skinData.find(s => s.id === skin.id);
                    if (savedSkin) {
                        skin.owned = savedSkin.owned;
                        skin.selected = savedSkin.selected;
                    }
                });
            }

            // Загрузка фонов
            const savedBackgrounds = localStorage.getItem('backgrounds');
            if (savedBackgrounds) {
                const bgData = JSON.parse(savedBackgrounds);
                backgrounds.forEach(bg => {
                    const savedBg = bgData.find(b => b.id === bg.id);
                    if (savedBg) {
                        bg.owned = savedBg.owned;
                        bg.selected = savedBg.selected;
                    }
                });
            }

            totalPoints = parseInt(localStorage.getItem('totalPoints') || '0');
            highScore = parseInt(localStorage.getItem('highScore') || '0');
        }

        // Сохранение данных
        function saveGameData() {
            localStorage.setItem('skins', JSON.stringify(skins));
            localStorage.setItem('backgrounds', JSON.stringify(backgrounds));
            localStorage.setItem('totalPoints', totalPoints.toString());
            localStorage.setItem('highScore', highScore.toString());
        }

        // Инициализация игры
        function initGame() {
            loadGameData();
            updatePointsDisplay();
            updateRecordsDisplay();
            drawBackground();
            gameLoop();
        }

        // Отрисовка фона
        function drawBackground() {
            const selectedBg = backgrounds.find(bg => bg.selected);
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, selectedBg.colors[0]);
            gradient.addColorStop(1, selectedBg.colors[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем облака для дневного неба
            if (selectedBg.id === 'default') {
                drawClouds();
            }
            
            // Рисуем звёзды для ночи и космоса
            if (selectedBg.id === 'night' || selectedBg.id === 'space') {
                drawStars();
            }
        }

        // Рисование облаков
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            // Простые облака
            drawCloud(80, 100, 50);
            drawCloud(250, 80, 40);
            drawCloud(350, 120, 60);
        }

        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x + size * 0.3, y, size * 0.7, 0, Math.PI * 2);
            ctx.arc(x + size * 0.6, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x - size * 0.3, y, size * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }

        // Рисование звёзд
        function drawStars() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            // Статичные звёзды
            const stars = [
                {x: 50, y: 50}, {x: 150, y: 80}, {x: 300, y: 60},
                {x: 80, y: 150}, {x: 250, y: 120}, {x: 350, y: 180},
                {x: 120, y: 200}, {x: 280, y: 250}, {x: 180, y: 300}
            ];

            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Отрисовка птички
        function drawBird() {
            const selectedSkin = skins.find(skin => skin.selected);
            ctx.fillStyle = selectedSkin.color;
            
            // Тело птички
            ctx.beginPath();
            ctx.arc(bird.x + bird.width/2, bird.y + bird.height/2, bird.width/2, 0, Math.PI * 2);
            ctx.fill();
            
            // Клюв
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.moveTo(bird.x + bird.width, bird.y + bird.height/2);
            ctx.lineTo(bird.x + bird.width + 10, bird.y + bird.height/2 - 5);
            ctx.lineTo(bird.x + bird.width + 10, bird.y + bird.height/2 + 5);
            ctx.closePath();
            ctx.fill();
            
            // Глаз
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(bird.x + bird.width/2 + 5, bird.y + bird.height/2 - 5, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(bird.x + bird.width/2 + 7, bird.y + bird.height/2 - 5, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Отрисовка труб
        function drawPipes() {
            ctx.fillStyle = '#228B22';
            pipes.forEach(pipe => {
                // Верхняя труба
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
                // Нижняя труба
                ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipe.width, canvas.height - pipe.topHeight - pipeGap);
                
                // Украшения на трубах
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipe.width + 10, 20);
                ctx.fillRect(pipe.x - 5, pipe.topHeight + pipeGap, pipe.width + 10, 20);
                ctx.fillStyle = '#228B22';
            });
        }

        // Создание новой трубы
        function createPipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight;
            const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
            
            pipes.push({
                x: canvas.width,
                width: 50,
                topHeight: topHeight,
                passed: false
            });
        }

        // Обновление позиций труб
        function updatePipes() {
            pipes.forEach((pipe, index) => {
                pipe.x -= gameSpeed;
                
                // Удаление труб, которые вышли за экран
                if (pipe.x + pipe.width < 0) {
                    pipes.splice(index, 1);
                }
                
                // Увеличение очков
                if (!pipe.passed && pipe.x + pipe.width < bird.x) {
                    pipe.passed = true;
                    score++;
                    document.getElementById('scoreDisplay').textContent = score;
                    
                    // Постепенное усложнение
                    if (score % 5 === 0) {
                        gameSpeed += 0.2;
                        if (pipeGap > 120) {
                            pipeGap -= 2;
                        }
                    }
                }
            });

            // Создание новых труб
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                createPipe();
            }
        }

        // Обновление птички
        function updateBird() {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Ограничения экрана
            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }
            if (bird.y + bird.height > canvas.height) {
                gameOver();
            }
        }

        // Проверка столкновений
        function checkCollisions() {
            pipes.forEach(pipe => {
                // Столкновение с верхней трубой
                if (bird.x < pipe.x + pipe.width &&
                    bird.x + bird.width > pipe.x &&
                    bird.y < pipe.topHeight) {
                    gameOver();
                }
                
                // Столкновение с нижней трубой
                if (bird.x < pipe.x + pipe.width &&
                    bird.x + bird.width > pipe.x &&
                    bird.y + bird.height > pipe.topHeight + pipeGap) {
                    gameOver();
                }
            });
        }

        // Прыжок птички
        function jump() {
            if (gameState === 'playing') {
                bird.velocity = bird.jump;
            }
        }

        // Начало игры
        function startGame() {
            gameState = 'playing';
            score = 0;
            gameSpeed = 2;
            pipeGap = 150;
            
            // Сброс позиции птички
            bird.x = 50;
            bird.y = 300;
            bird.velocity = 0;
            
            // Очистка труб
            pipes = [];
            
            // Скрытие меню, показ игрового интерфейса
            hideAllScreens();
            document.getElementById('gameUI').classList.remove('hidden');
            document.getElementById('scoreDisplay').textContent = '0';
        }

        // Окончание игры
        function gameOver() {
            gameState = 'gameOver';
            
            // Обновление рекордов
            totalPoints += score;
            if (score > highScore) {
                highScore = score;
            }
            
            saveGameData();
            
            // Показ экрана Game Over
            document.getElementById('gameUI').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = score;
            document.getElementById('bestScore').textContent = highScore;
        }

        // Основной игровой цикл
        function gameLoop() {
            // Очистка канваса
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка фона
            drawBackground();
            
            if (gameState === 'playing') {
                updateBird();
                updatePipes();
                checkCollisions();
                drawPipes();
            }
            
            drawBird();
            
            requestAnimationFrame(gameLoop);
        }

        // Функции управления экранами
        function hideAllScreens() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('shopScreen').classList.add('hidden');
            document.getElementById('recordsScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
        }

        function showMainMenu() {
            hideAllScreens();
            document.getElementById('gameUI').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            gameState = 'menu';
        }

        function showShop() {
            hideAllScreens();
            document.getElementById('shopScreen').classList.remove('hidden');
            updateShop();
        }

        function showRecords() {
            hideAllScreens();
            document.getElementById('recordsScreen').classList.remove('hidden');
            updateRecordsDisplay();
        }

        // Функции магазина
        function switchTab(tab) {
            currentTab = tab;
            
            // Обновление активной вкладки
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateShop();
        }

        function updateShop() {
            updatePointsDisplay();
            
            const shopItems = document.getElementById('shopItems');
            shopItems.innerHTML = '';
            
            const items = currentTab === 'skins' ? skins : backgrounds;
            
            items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item';
                
                const itemInfo = document.createElement('div');
                itemInfo.className = 'item-info';
                
                const itemPreview = document.createElement('div');
                itemPreview.className = 'item-preview';
                
                if (currentTab === 'skins') {
                    itemPreview.style.backgroundColor = item.color;
                } else {
                    const gradient = `linear-gradient(to bottom, ${item.colors[0]}, ${item.colors[1]})`;
                    itemPreview.style.background = gradient;
                }
                
                const itemDetails = document.createElement('div');
                itemDetails.className = 'item-details';
                itemDetails.innerHTML = `
                    <h3>${item.name}</h3>
                    <div class="item-price">${item.price > 0 ? `${item.price} очков` : 'Бесплатно'}</div>
                `;
                
                itemInfo.appendChild(itemPreview);
                itemInfo.appendChild(itemDetails);
                
                const actionButton = document.createElement('button');
                
                if (item.selected) {
                    actionButton.className = 'selected';
                    actionButton.textContent = 'Выбрано';
                    actionButton.disabled = true;
                } else if (item.owned) {
                    actionButton.className = 'buy-button';
                    actionButton.textContent = 'Выбрать';
                    actionButton.onclick = () => selectItem(item.id);
                } else {
                    actionButton.className = 'buy-button';
                    actionButton.textContent = 'Купить';
                    actionButton.disabled = totalPoints < item.price;
                    actionButton.onclick = () => buyItem(item.id);
                }
                
                itemDiv.appendChild(itemInfo);
                itemDiv.appendChild(actionButton);
                shopItems.appendChild(itemDiv);
            });
        }

        function buyItem(itemId) {
            const items = currentTab === 'skins' ? skins : backgrounds;
            const item = items.find(i => i.id === itemId);
            
            if (item && totalPoints >= item.price && !item.owned) {
                totalPoints -= item.price;
                item.owned = true;
                saveGameData();
                updateShop();
            }
        }

        function selectItem(itemId) {
            const items = currentTab === 'skins' ? skins : backgrounds;
            
            // Снимаем выбор с текущего элемента
            items.forEach(item => item.selected = false);
            
            // Выбираем новый элемент
            const item = items.find(i => i.id === itemId);
            if (item && item.owned) {
                item.selected = true;
                saveGameData();
                updateShop();
            }
        }

        function updatePointsDisplay() {
            document.getElementById('shopPoints').textContent = totalPoints;
        }

        function updateRecordsDisplay() {
            document.getElementById('highScoreDisplay').textContent = highScore;
            document.getElementById('totalPointsDisplay').textContent = totalPoints;
        }

        // Обработчики событий
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', jump);

        // Предотвращение контекстного меню
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Запуск игры при загрузке страницы
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
